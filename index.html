<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>아스라다 홈</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--
  아스라다 홈 — 텔레그램 미니앱. 서버 없이 동작한다.
  봇(dashboard.py)이 버튼을 보낼 때 숫자를 JSON→zlib→base64url 로 URL '#' 뒤에 담는다.
  '#' 뒤는 브라우저 밖으로 나가지 않으므로 이 페이지를 올린 곳엔 숫자가 남지 않는다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /*
    디자인: 1win 스타일 (DESIGN-1win.md, 2026-10-23 적용) + 프리텐다드 글꼴
    거의 검은 바탕(#141415) 위에 짙은 회색 카드(#2e3035) 한 단계, 그림자 대신 밝기 차이로 층을 나눈다.
    강조색은 두 개뿐: 파랑(#0075ff) = 막대·게이지·선택·제목 표시·대표 숫자 칸, 초록(#00b24b) = 확인 버튼·지금·정상·다음 일정.
    2026-10-23 두 색을 더 적극적으로: 칸 제목 앞 색 막대, 맨 위 '오늘' 칸은 파랑 그라데이션 배너,
    D-day·지금 단계는 파랑 알약, 대표 숫자 칸은 파랑 채움, 지금 시각·다음 일정·오늘 막대·정상 표시는 초록.
    글씨는 굵게만(본문 600, 제목 800). 모서리는 카드 16px, 버튼 10px, 작은 칸 8px, 알약 999px.
    텔레그램 테마와 상관없이 항상 어두운 화면.
    2026-10-23 사용자 요청: 칸마다 고유색(--c, 제목 막대·바로가기 버튼), 글래스모피즘
    (바탕 뒤에 색 번짐을 깔고 카드·바로가기 줄은 반투명 + 뒤 흐림).
  */
  :root {
    --bg: #141415;          /* canvas */
    --card: #2e3035;        /* surface: 카드 */
    --soft: rgba(0,0,0,.24);  /* 카드 안의 움푹한 칸 (숫자 칸·시간별 날씨) — 유리 위라 반투명 */
    --glass: rgba(46,48,53,.52);  /* 유리 카드 */
    --glass-edge: rgba(255,255,255,.10);
    --ink: #f0f2f5;         /* 제목·주요 글씨 */
    --body: #c9ced8;        /* 본문 */
    --muted: #9aa1b1;       /* 보조 글씨 */
    --faint: #53575f;       /* 흐린 글씨 */
    --accent: #0075ff;      /* secondary 파랑: 막대·게이지·선택 */
    --primary: #00b24b;     /* primary 초록: 확인 버튼 */
    --line: rgba(255,255,255,.08);  /* hairline: 카드 안 구분선 */
    --accent-soft: rgba(0,117,255,.14);   /* 파랑 옅은 바탕 */
    --primary-soft: rgba(0,178,75,.14);   /* 초록 옅은 바탕 */
    --track: #43464d;       /* 빈 막대 */
    /* 상태색: 아이콘+글자와 함께만 쓴다 */
    --red: #ff4d4f; --yellow: #f4b400; --green: #00b24b;
    --r-card: 16px; --r-btn: 10px; --r-cell: 8px; --r-pill: 999px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* 유리 뒤에 비칠 색 번짐 (화면에 고정) */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 30% at 10% 8%, rgba(0,117,255,.45), transparent 70%),
      radial-gradient(35% 28% at 95% 30%, rgba(139,92,246,.35), transparent 70%),
      radial-gradient(40% 30% at 0% 65%, rgba(0,178,75,.30), transparent 70%),
      radial-gradient(35% 30% at 100% 92%, rgba(0,184,217,.30), transparent 70%); }
  body {
    margin: 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--body);
    font: 600 14px/1.45 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { padding: 0 12px; }
  header { padding: 20px 16px 14px; }
  header h1 { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.1; color: var(--ink); letter-spacing: -0.5px; }
  header h1 em { font-style: normal; color: var(--primary); }
  header h1 .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
                   margin-left: 8px; vertical-align: 6px; box-shadow: 0 0 0 4px var(--primary-soft); }
  header .when { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .stale { color: var(--yellow); }
  section { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: var(--r-card);
            padding: 18px 16px; margin-bottom: 10px;
            -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
  section h2 { margin: 0 0 14px; font-size: 18px; font-weight: 800; color: var(--ink); line-height: 1.2;
               display: flex; align-items: center; gap: 8px; }
  section h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--c); flex: none;
                       box-shadow: 0 0 10px var(--c); }

  :root { --c: var(--accent); }
  /* 칸별 고유색 — 칸(data-c)과 바로가기 버튼(data-j)이 같은 색을 쓴다 */
  [data-c=today], [data-j=today] { --c: #0075ff; }
  [data-c=wx]                    { --c: #2fa8ff; }
  [data-c=ev], [data-j=ev]       { --c: #00b8d9; }
  [data-c=st], [data-j=st]       { --c: #a77bff; }
  [data-c=hl], [data-j=hl]       { --c: #00b24b; }
  [data-c=yt], [data-j=yt]       { --c: #ff4d6d; }
  [data-c=rm]                    { --c: #ff8a3d; }
  [data-c=lg], [data-j=lg]       { --c: #f4b400; }
  [data-c=bk]                    { --c: #7d8597; }
  [data-c=us], [data-j=us]       { --c: #5b7cff; }
  section h2 .cnt { margin-left: auto; background: var(--c); color: #fff; border-radius: var(--r-pill);
                    font-size: 12px; font-weight: 800; padding: 2px 9px; }

  /* 맨 위 '오늘' 칸 — 파랑 배너 (hero-banner) */
  section.hero { border-color: rgba(255,255,255,.18); background: radial-gradient(120% 140% at 100% 0%, #2b8cff 0%, #0075ff 35%, #0049a8 100%); }
  section.hero h2 { color: rgba(255,255,255,.85); font-size: 14px; margin-bottom: 10px; }
  section.hero h2::before { background: #fff; }
  section.hero .today { color: #fff; }
  section.hero .today small { color: rgba(255,255,255,.9); }
  section.hero .today .pill { background: #fff; color: var(--accent); }
  section.hero .meta { color: rgba(255,255,255,.8); border-top: 1px solid rgba(255,255,255,.2); padding-top: 10px; margin-top: 14px; gap: 10px; }
  section.hero .meta b { color: #fff; font-weight: 800; white-space: nowrap; }
  .pill { display: inline-block; background: var(--c); color: #fff; border-radius: var(--r-pill);
          font-size: 13px; font-weight: 800; padding: 3px 10px; line-height: 1.3; vertical-align: 3px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  /* 한 줄 요약 */
  .today { font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.3; }
  .today small { display: block; font-weight: 600; color: var(--body); font-size: 14px; margin-top: 4px; }

  /* 유튜브 */
  .yt { padding: 14px 0; border-top: 1px solid var(--line); }
  .yt:first-of-type { border-top: 0; padding-top: 0; }
  .yt .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .yt .title { font-weight: 800; color: var(--ink); font-size: 15px; }
  .yt .dday { white-space: nowrap; }
  .yt .row { align-items: center; }
  .yt .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; }
  .badge.r { color: var(--red); } .badge.y { color: var(--yellow); } .badge.g { color: var(--green); }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 10px; }
  .steps div { height: 5px; background: var(--track); border-radius: var(--r-pill); }
  .steps div.on { background: var(--c); }
  .steps-label { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11px; color: var(--muted); margin-top: 5px; text-align: center; }
  /* 지금 단계는 파랑 알약 */
  .steps-label .cur { color: #fff; font-weight: 800; position: relative; z-index: 0; }
  .steps-label .cur::before { content: ""; position: absolute; z-index: -1; left: 3px; right: 3px; top: 50%; height: 22px;
                              transform: translateY(-50%); background: var(--c); border-radius: var(--r-pill); }
  .steps-label button.cur::before { top: calc(50% + 3px); }
  /* 단계 버튼 — 누르면 봇에게 단계 변경을 보낸다 */
  .steps-label button { font: inherit; color: inherit; background: none; border: 0; padding: 6px 0; margin-top: -6px;
                        cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .steps-label button.cur { color: #fff; font-weight: 800; }
  .steps-label button:active { color: var(--accent); }
  .yt .done { margin-top: 10px; width: 100%; padding: 11px; background: var(--primary); border: 0; border-radius: var(--r-btn);
              color: #fff; font: 600 14px/1 inherit; cursor: pointer; }
  .yt .done:active { filter: brightness(.9); }
  .hint { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }

  /* 날씨 */
  .wx { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .wx .big { font-size: 44px; font-weight: 800; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .wx .big small { font-size: 18px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .wx .cond { text-align: right; color: var(--ink); font-size: 15px; }
  .wx .cond small { display: block; color: var(--muted); font-size: 13px; }
  .wx-tip { margin-top: 14px; padding: 10px 12px; background: var(--soft); border-radius: var(--r-cell);
            box-shadow: inset 3px 0 0 var(--accent); color: var(--ink); font-size: 14px; }
  .wx-tip { background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 3px 0 0 var(--c); }
  .hours { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; text-align: center; }
  .hours div { background: var(--soft); border-radius: var(--r-cell); padding: 8px 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hours b { display: block; color: var(--ink); font-size: 15px; font-weight: 800; margin: 2px 0; }
  .hours div.now { background: var(--c); color: rgba(255,255,255,.85); }
  .hours div.now b { color: #fff; }

  /* 오늘 일정 타임라인 */
  .allday { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .allday span { background: color-mix(in srgb, var(--c) 16%, transparent); border-radius: var(--r-cell); box-shadow: inset 3px 0 0 var(--c);
                 padding: 6px 10px; font-size: 13px; color: var(--ink); }
  .allday em { font-style: normal; color: var(--muted); font-size: 11px; margin-left: 6px; }
  .tl { position: relative; margin-left: 58px; border-left: 1px solid var(--track); }
  .tl .ev { position: relative; padding: 0 0 16px 16px; font-size: 14px; }
  .tl .ev:last-child { padding-bottom: 2px; }
  .tl .ev::before { content: ""; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .tl .ev .t { position: absolute; left: -58px; width: 48px; top: 0; text-align: right; color: var(--ink);
               font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13px; }
  .tl .ev .ttl { color: var(--ink); }
  .tl .ev .sub { color: var(--muted); font-size: 12px; }
  .tl .ev.past { opacity: .45; }
  .tl .ev.past::before { background: var(--track); }
  /* 바로 다음 일정은 초록 */
  .tl .ev.next::before { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .tl .ev.next .t { color: var(--primary); }
  .tl .ev.next .ttl { font-weight: 800; }
  .tl .nowline { position: relative; height: 0; border-top: 2px solid var(--primary); margin: 0 0 16px -1px; }
  .tl .nowline span { position: absolute; left: -52px; top: -10px; font-size: 10px; line-height: 1;
                      font-weight: 800; color: #fff; background: var(--primary); border-radius: var(--r-pill); padding: 4px 7px; }

  /* 리스트 */
  .li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .li:first-of-type { border-top: 0; padding-top: 0; }
  .li .at { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 92px; }
  .rm .li > .at:first-child { color: var(--c); font-weight: 800; }

  /* 숫자 칸 */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .tile { background: var(--soft); border-radius: var(--r-cell); padding: 14px; }
  .tile .v { font-size: 24px; font-weight: 800; color: var(--ink); line-height: 1.15; font-variant-numeric: tabular-nums;
              white-space: nowrap; }
  /* 좁은 폰에서 큰 금액이 줄바꿈되지 않게 글자 크기를 화면 폭에 맞추고 '원'은 작게 (2026-10-23) */
  .tile .v.won { font-size: clamp(19px, 5.6vw, 24px); }
  .tile .v small { font-size: .62em; font-weight: 800; margin-left: 2px; }
  .tile .k { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 6px; }
  /* 대표 숫자는 파랑 채움, 식비는 초록 테 */
  .tile.main { background: var(--accent); }
  .tile.main .v { color: #fff; } .tile.main .k { color: rgba(255,255,255,.85); }
  .tile.food { background: var(--primary-soft); box-shadow: inset 3px 0 0 var(--primary); }
  .tile.food .k { color: var(--primary); }
  /* 가계부 칸은 슬림하게: 지출 칸을 넓게 잡아 금액이 한 줄에, 식비는 한 줄짜리 띠 (2026-10-23) */
  .tiles.slim { grid-template-columns: 1.7fr 1fr; }
  .tiles.slim .tile { padding: 9px 12px; }
  .tiles.slim .tile .v { font-size: 19px; }
  .tiles.slim .tile .v.won { font-size: clamp(17px, 5vw, 20px); }
  .tiles.slim .tile .k { font-size: 11px; margin-top: 2px; }
  .tiles.slim .tile.food { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
  .tiles.slim .tile.food .k { order: -1; margin-top: 0; font-size: 12px; }

  /* 막대그래프 (단일 계열) */
  .chart { position: relative; margin-top: 18px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 1px solid var(--track); }
  .bar { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
  .bar i { display: block; width: 100%; background: var(--accent); min-height: 0; border-radius: 3px 3px 0 0; }
  .bar i { background: linear-gradient(180deg, #2b8cff, var(--accent)); }
  .bar:last-child i { background: var(--primary); }   /* 오늘 */
  .bar.sel i, .bar:hover i { background: var(--ink); }
  .bar.zero i { height: 2px !important; background: var(--track); }
  .xlab { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); border-radius: 6px;
         font-size: 12px; font-weight: 800; padding: 5px 9px; white-space: nowrap; pointer-events: none; display: none; }

  /* 게이지 */
  .gauge { height: 6px; background: var(--track); border-radius: var(--r-pill); overflow: hidden; margin-top: 8px; }
  .gauge i { display: block; height: 100%; background: var(--accent); border-radius: var(--r-pill); }
  .gauge.warn i { background: var(--yellow); }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 5px; }

  details { margin-top: 16px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  td, th { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); font-weight: 600; }
  td:first-child, th:first-child { text-align: left; }
  th { color: var(--muted); font-size: 12px; }

  .vs { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .vs b { color: var(--ink); font-weight: 800; }
  .cat { margin-top: 12px; }
  .cat .row { display: flex; justify-content: space-between; font-size: 14px; }
  /* 가계부 분류 비중: 큰 도넛 + 범례, 아래에 분류별 작은 링 */
  .donut-wrap { display: flex; align-items: center; gap: 18px; margin-top: 20px; }
  .donut { width: 128px; height: 128px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .donut > div { width: 84px; height: 84px; border-radius: 50%; background: #26282d; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; text-align: center; }
  .donut b { color: var(--ink); font-size: 22px; font-weight: 800; line-height: 1; }
  .donut span { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .legend { flex: 1; display: grid; gap: 6px; font-size: 13px; }
  .legend div { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .legend span { flex: 1; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend b { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
  .ring-it { background: var(--soft); border-radius: var(--r-cell); padding: 12px 4px 10px; text-align: center; min-width: 0; }
  .ring { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; position: relative; }
  .ring::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #1f2125; }
  .ring b { position: relative; z-index: 1; color: var(--ink); font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ring-k { color: var(--ink); font-size: 12px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ring-v { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  /* 분류 칸을 꾹 누르면 상세 내역 팝업 (2026-10-24) */
  .ring-it { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: transform .15s; }
  .ring-it.hold { transform: scale(.95); }
  .pop-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .pop { width: 100%; max-width: 520px; max-height: 70vh; overflow-y: auto; background: var(--card); border: 1px solid var(--glass-edge);
         border-radius: var(--r-card) var(--r-card) 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .pop h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; color: var(--ink); display: flex; justify-content: space-between; }
  .pop .li .at { min-width: 64px; }
  .pop .li span:nth-child(2) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop .li b { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pop .more { color: var(--muted); font-size: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .cat .gauge i { background: var(--c); }
  .ok { color: var(--green); font-weight: 800; } .bad { color: var(--red); font-weight: 800; }
  .ok.pill { background: var(--primary); color: #fff; } .bad.pill { background: var(--red); color: #fff; }
  .foot { text-align: center; color: var(--faint); font-size: 12px; margin-top: 16px; }

  /* 바로가기 — 위에 붙어 있는 큰 버튼. 누르면 그 칸으로 스크롤 (2026-10-22 사용자 요청) */
  nav.jump { position: sticky; top: 0; z-index: 10; background: rgba(20,20,21,.55); padding: 8px 12px 10px; border-bottom: 1px solid var(--glass-edge);
             -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
             display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  nav.jump[hidden] { display: none; }
  /* 버튼마다 자기 칸 색: 평소엔 옅은 색유리 + 색 점, 지금 보는 칸은 그 색으로 채움 */
  nav.jump button { font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; color: var(--ink);
                    background: color-mix(in srgb, var(--c) 16%, rgba(255,255,255,.04));
                    border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
                    border-radius: var(--r-btn); padding: 13px 0; cursor: pointer;
                    display: flex; align-items: center; justify-content: center; gap: 6px;
                    -webkit-tap-highlight-color: transparent; transition: background .2s, box-shadow .2s; }
  nav.jump button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  nav.jump button.on { color: #fff; background: var(--c); border-color: transparent;
                       box-shadow: 0 4px 16px color-mix(in srgb, var(--c) 55%, transparent); }
  nav.jump button.on::before { background: #fff; }
  nav.jump button:active { filter: brightness(.9); }
  section { scroll-margin-top: 116px; }

  /* 오늘의 코디 — 매일 09:30 하나씩 바뀐다 (2026-10-22, 채팅 사진 대신) */
  .st-wx { color: var(--muted); font-size: 13px; margin: -6px 0 12px; }
  .st-img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: var(--soft); border-radius: 12px; cursor: pointer; }
  .st-look { color: var(--ink); font-weight: 800; font-size: 16px; line-height: 1.4; margin: 14px 0 4px; }
  .st-items { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .st .li .at { min-width: 64px; }
  .st a { color: var(--c); font-size: 12px; }
</style>
</head>
<body>
<header><h1>Asurada <em>홈</em><span class="dot"></span></h1><span class="when" id="when"></span></header>
<nav class="jump" id="jump" hidden></nav>
<main id="app"><section><p class="empty">불러오는 중…</p></section></main>
<p class="foot" id="foot"></p>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  // 텔레그램 상단바·바깥 배경도 바탕색으로 맞춘다 (구버전 앱에선 없는 기능이라 조용히 넘어감)
  try { tg.setHeaderColor("#141415"); tg.setBackgroundColor("#141415"); } catch (e) {}
  // 버튼·링크·막대를 누를 때마다 가벼운 햅틱 (2026-10-24 사용자 요청). 꾹 누르기 팝업은 bindRings 에서 따로 'medium'
  document.addEventListener("click", (e) => {
    if (e.target.closest("button, a, .bar, .pop-bg") && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred("light"); } catch (err) {}
    }
  }, true);
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n) => Number(n || 0).toLocaleString("ko-KR");
// 가계부 분류 비중 색 (큰 순서대로, 마지막 '그 외'는 회색 쪽)
const RING = ["#f4b400", "#0075ff", "#00b8d9", "#a77bff", "#00b24b", "#ff4d6d", "#ff8a3d", "#7d8597"];
const ringCol = (c, i) => (c[0] === "그 외" ? "#7d8597" : RING[i % (RING.length - 1)]);
const STAGES = ["수령", "스크립트", "촬영", "편집", "업로드"];
const LEVEL = { r: ["🔴", "서둘러야 함"], y: ["🟡", "여유 없음"], g: ["🟢", "여유 있음"] };

async function decode(hash) {
  const b64 = hash.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}

function dday(l) {
  if (l == null) return "";
  if (l === 0) return "D-DAY";
  return l > 0 ? `D-${l}` : `D+${-l}`;
}

function secToday(d) {
  const urgent = (d.yt || []).find((x) => x.c === "r") || (d.yt || [])[0];
  const next = (d.rm || []).find((x) => !x.p);
  let html = '<section class="hero"><h2>오늘</h2>';
  if (urgent) {
    html += `<div class="today">${esc(urgent.n)} <span class="pill">${dday(urgent.l)}</span><small>지금 할 일: ${esc(urgent.todo)}</small></div>`;
  } else {
    html += '<div class="today">급한 영상 없음</div>';
  }
  if (next) html += `<div class="meta"><span>다음 알림 · ${esc(next.m)}</span><b>${esc(next.a)}</b></div>`;
  return html + "</section>";
}

// WMO 날씨 코드 → 이모지
function wxIcon(c) {
  if (c === 0) return "☀️";
  if (c <= 2) return "🌤️";
  if (c === 3) return "☁️";
  if (c <= 48) return "🌫️";
  if (c <= 67 || (c >= 80 && c <= 82)) return "🌧️";
  if (c <= 86) return "🌨️";
  return "⛈️";
}

function secWeather(wx) {
  if (!wx) return "";
  const hourNow = new Date().getHours();
  const hours = wx.h.map((h) => {
    const cur = hourNow >= h[0] && hourNow < h[0] + 3;
    return `<div class="${cur ? "now" : ""}">${h[0]}시<b>${h[1]}°</b>${wxIcon(h[3])}${h[2] >= 30 ? ` ${h[2]}%` : ""}</div>`;
  }).join("");
  return `<section><h2>날씨 · ${esc(wx.p)}</h2>
    <div class="wx"><div class="big">${wx.now ?? wx.hi}°<small> 지금</small></div>
      <div class="cond">${wxIcon(wx.c)} ${esc(wx.w)}<small>최저 ${wx.lo}° · 최고 ${wx.hi}° · 비 ${wx.pp}%</small></div></div>
    <div class="hours">${hours}</div>
    <div class="wx-tip">${esc(wx.tip)}</div></section>`;
}

function secEvents(ev) {
  const head = '<section><h2>오늘 일정</h2>';
  if (!ev) return head + '<p class="empty">아침 브리핑 뒤에 채워져요</p></section>';
  const allday = ev.ev.filter((e) => !e[0]);
  const timed = ev.ev.filter((e) => e[0]);
  let html = head;
  if (allday.length) {
    html += `<div class="allday">${allday.map((e) => `<span>${esc(e[2])}${e[3] ? `<em>${esc(e[3])}</em>` : ""}</span>`).join("")}</div>`;
  }
  if (timed.length) {
    const d = new Date();
    const now = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    let placed = false, nextDone = false, rows = "";
    const nowline = `<div class="nowline"><span>NOW</span></div>`;
    for (const e of timed) {
      if (!placed && e[0] > now) { rows += nowline; placed = true; }
      const past = (e[1] || e[0]) <= now;
      const nx = !past && !nextDone; if (nx) nextDone = true;
      rows += `<div class="ev${past ? " past" : ""}${nx ? " next" : ""}"><span class="t">${esc(e[0])}</span>
        <div class="ttl">${esc(e[2])}</div>
        <div class="sub">${e[1] ? `~${esc(e[1])}` : ""}${e[3] ? `${e[1] ? " · " : ""}${esc(e[3])}` : ""}</div></div>`;
    }
    if (!placed) rows += nowline;
    html += `<div class="tl">${rows}</div>`;
  } else if (!allday.length) {
    html += '<p class="empty">오늘은 일정이 없어요</p>';
  }
  return html + `<div class="meta"><span>${esc(ev.at)} 캘린더 기준</span></div></section>`;
}

// 오늘의 코디 — 사진은 이 페이지 옆 style.jpg (날짜를 붙여 어제 사진이 캐시로 남지 않게), 날씨는 한 줄만
function secStyle(st, wx) {
  if (!st) return '<section><h2>오늘의 코디</h2><p class="empty">아침 9시 30분에 올라와요</p></section>';
  const w = wx ? `<p class="st-wx">${wxIcon(wx.c)} ${esc(wx.w)} · ${wx.lo}~${wx.hi}° · 비 ${wx.pp}%</p>` : "";
  const row = (k, v) => v ? `<div class="li"><span class="at">${k}</span><span>${esc(v)}</span></div>` : "";
  const src = st.src ? `<div class="meta"><a href="${esc(st.src)}" data-link>사진 출처 보기</a></div>` : "";
  return `<section class="st"><h2>${st.old ? `${esc(st.dl)} 코디` : "오늘의 코디"}${st.m ? ` · ${esc(st.m)}` : ""}</h2>${st.old ? "" : w}
    <img class="st-img" src="style.jpg?v=${esc(st.d)}" alt="${esc(st.lk)}" ${st.src ? `data-href="${esc(st.src)}"` : ""}
      onerror="this.remove()">
    <div class="st-look">${esc(st.lk)}</div><div class="st-items">${esc(st.it)}</div>
    ${row("좋은 이유", st.why)}${row("따라 입기", st.how)}${row("날씨", st.ss)}${src}</section>`;
}

// 바깥 링크는 텔레그램 브라우저로 연다
function bindLinks() {
  const open = (url) => (tg && tg.openLink ? tg.openLink(url) : window.open(url, "_blank"));
  document.querySelectorAll("a[data-link]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); open(a.href); }));
  document.querySelectorAll("img[data-href]").forEach((img) => img.addEventListener("click", () => open(img.dataset.href)));
}

// 건강 — 수면 점수·어제 활동·다음 날 목표 (점수와 목표는 health.py 가 계산)
function secHealth(hl) {
  if (!hl) return '<section><h2>건강</h2><p class="empty">아직 건강 기록이 없어요</p></section>';
  const { sl, ac, g, w } = hl;
  const tile = (v, k, c = "") => `<div class="tile ${c}"><div class="v">${v}</div><div class="k">${esc(k)}</div></div>`;
  let tiles = "", stages = "", goal = "", chart = "";
  if (sl) {
    tiles += tile(`${sl.sc}점`, `수면 점수 · ${sl.d}`, "main") + tile(`${Math.floor(sl.m / 60)}시간 ${sl.m % 60}분`, "잔 시간");
    if (sl.deep != null && sl.rem != null) {
      stages = `<div class="vs">깊은 잠 <b>${sl.deep}분</b> · 렘 <b>${sl.rem}분</b>${sl.awake != null ? ` · 깸 <b>${sl.awake}분</b>` : ""}</div>`;
    }
  }
  if (ac) {
    tiles += tile(`${num(ac.st)}보`, `걸음 · ${ac.d}`)
      + (ac.kc != null ? tile(`${num(ac.kc)}kcal`, "활동") : ac.ex != null ? tile(`${ac.ex}분`, "운동") : "");
  }
  if (g) {
    goal = `<div class="wx-tip"><b>${esc(g.d)} 목표 ${num(g.st)}보${g.kc ? ` · 활동 ${num(g.kc)}kcal` : ""}</b><br>${esc(g.note)} (최근 평균 ${num(g.avg)}보)</div>`;
  }
  if (w && w.length) {
    const max = Math.max(1, ...w.map((x) => x[1]));
    const bars = w.map((x, i) => `<div class="bar${x[1] ? "" : " zero"}" data-i="${i}" role="img"
        aria-label="${x[0]} ${num(x[1])}보"><i style="height:${(x[1] / max) * 100}%"></i></div>`).join("");
    chart = `<div class="chart" id="hlchart"><div class="tip" id="hltip"></div><div class="bars">${bars}</div>
      <div class="xlab"><span>${w[0][0]}</span><span>날짜별 걸음</span><span>${w[w.length - 1][0]}</span></div></div>`;
  }
  return `<section><h2>건강</h2><div class="tiles">${tiles}</div>${stages}${goal}${chart}</section>`;
}

// 유튜브 단계 변경 — 미니앱은 봇에 직접 말을 못 걸어서 t.me 링크로 '/start yt_번호_단계' 를 보내게 한다
function moveStage(id, title, idx) {
  const bot = window.__bot;
  const go = () => {
    tg.openTelegramLink(`https://t.me/${bot}?start=yt_${id}_${idx}`);
    try { tg.close(); } catch (e) {}
  };
  // 단계 옮기기는 누르면 바로 (2026-10-23 가볍게). 목록에서 빠지는 '완료'만 한 번 묻는다.
  if (idx !== 5) return go();
  const q = `'${title}' 업로드 끝났나요? 완료로 옮길게요.`;
  if (tg.showConfirm) tg.showConfirm(q, (ok) => ok && go());
  else if (confirm(q)) go();
}

function secYoutube(yt, canEdit) {
  if (yt == null) return '<section><h2>유튜브 · small table</h2><p class="empty">불러오지 못했어요</p></section>';
  if (!yt.length) return '<section><h2>유튜브 · small table</h2><p class="empty">진행 중인 영상이 없어요</p></section>';
  const rows = yt.map((x) => {
    const [ico, lab] = LEVEL[x.c] || LEVEL.g;
    const steps = STAGES.map((_, i) => `<div class="${i <= x.si ? "on" : ""}"></div>`).join("");
    const labels = STAGES.map((s, i) => canEdit && x.id != null
      ? `<button type="button" class="${i === x.si ? "cur" : ""}" data-id="${x.id}" data-i="${i}">${s}</button>`
      : `<span class="${i === x.si ? "cur" : ""}">${s}</span>`).join("");
    const done = canEdit && x.id != null && x.si === 4
      ? `<button type="button" class="done" data-id="${x.id}" data-i="5">업로드 끝 → 완료</button>` : "";
    return `<div class="yt" data-title="${esc(x.n)}">
      <div class="row"><span class="title">${esc(x.n)}${x.sp ? " 💰" : ""}</span><span class="dday pill">${dday(x.l)}</span></div>
      <div class="sub"><span class="badge ${x.c}">${ico} ${lab}</span> · 업로드 ${esc(x.d || "미정")} · 지금 ${esc(x.s)}</div>
      <div class="steps" aria-hidden="true">${steps}</div>
      <div class="steps-label">${labels}</div>${done}
    </div>`;
  }).join("");
  const hint = canEdit ? '<p class="hint">단계 이름을 누르면 바로 옮겨져요</p>' : "";
  return `<section><h2>유튜브 · small table</h2>${hint}${rows}</section>`;
}

function bindStages() {
  document.querySelectorAll(".yt button[data-id]").forEach((b) => {
    b.addEventListener("click", () => {
      const i = +b.dataset.i, card = b.closest(".yt");
      const cur = card.querySelector(".steps-label .cur");
      if (cur === b) return;   // 이미 그 단계
      moveStage(+b.dataset.id, card.dataset.title, i);
    });
  });
}

function secReminders(rm) {
  let body;
  if (rm == null) body = '<p class="empty">불러오지 못했어요</p>';
  else if (!rm.length) body = '<p class="empty">걸어둔 알림이 없어요</p>';
  else body = rm.map((x) => `<div class="li"><span class="at">${esc(x.a)}</span><span>${esc(x.m)}${x.r ? ` <span class="at">(${esc(x.r)})</span>` : ""}</span></div>`).join("");
  return `<section class="rm"><h2>리마인드${rm && rm.length ? `<span class="cnt">${rm.length}</span>` : ""}</h2>${body}</section>`;
}

function secLedger(lg) {
  if (!lg) return '<section><h2>가계부</h2><p class="empty">아직 기록된 지출이 없어요</p></section>';
  // 분류별 비중 — 큰 도넛 하나 + 분류마다 작은 링 (2026-10-23 사용자 요청)
  // dashboard 는 상위 6개만 보내므로 나머지는 '그 외'로 묶는다. 환불(음수)은 비중에서 뺀다
  const pos = lg.cat.filter((c) => c[1] > 0);
  const rest = lg.sum - pos.reduce((a, c) => a + c[1], 0) - lg.cat.filter((c) => c[1] < 0).reduce((a, c) => a + c[1], 0);
  if (rest > 0) pos.push(["그 외", rest]);
  const tot = Math.max(1, pos.reduce((a, c) => a + c[1], 0));
  let acc = 0;
  const stops = pos.map((c, i) => {
    const a = acc; acc += (c[1] / tot) * 100;
    return `${ringCol(c, i)} ${a}% ${acc}%`;
  }).join(", ");
  const rings = pos.map((c, i) => {
    const p = (c[1] / tot) * 100, col = ringCol(c, i);
    return `<div class="ring-it" data-cat="${esc(c[0])}"><div class="ring" style="background:conic-gradient(${col} ${p}%, var(--track) 0)"><b>${Math.round(p)}%</b></div>
      <div class="ring-k">${esc(c[0])}</div><div class="ring-v">${num(c[1])}원</div></div>`;
  }).join("");
  const top = pos[0];
  const cats = pos.length ? `<div class="donut-wrap">
      <div class="donut" style="background:conic-gradient(${stops})"><div><b>${Math.round((top[1] / tot) * 100)}%</b><span>${esc(top[0])}</span></div></div>
      <div class="legend">${pos.map((c, i) => `<div><i style="background:${ringCol(c, i)}"></i><span>${esc(c[0])}</span><b>${Math.round((c[1] / tot) * 100)}%</b></div>`).join("")}</div>
    </div><div class="rings">${rings}</div>` : "";
  const dd = lg.dd || [];
  let chart = "";
  if (dd.length) {
    const dmax = Math.max(1, ...dd);
    const bars = dd.map((v, i) => `<div class="bar${v > 0 ? "" : " zero"}" data-i="${i}" role="img"
        aria-label="${i + 1}일 ${num(v)}원"><i style="height:${(Math.max(0, v) / dmax) * 100}%"></i></div>`).join("");
    chart = `<div class="chart" id="lgchart"><div class="tip" id="lgtip"></div><div class="bars">${bars}</div>
      <div class="xlab"><span>1일</span><span>날짜별 지출</span><span>오늘</span></div></div>`;
  }
  let vs = "";
  if (lg.prev) {
    const diff = Math.round(((lg.sum - lg.prev) / lg.prev) * 100);
    const word = diff === 0 ? "똑같아요" : diff > 0 ? `<b>${diff}% 더</b> 썼어요` : `<b>${-diff}% 덜</b> 썼어요`;
    vs = `<div class="vs">${esc(lg.pm)} 같은 기간(${num(lg.prev)}원)보다 ${word}</div>`;
  }
  // '○월 식비' 묶음 칸은 사용자 요청으로 뺌 (2026-10-24)
  return `<section><h2>가계부 · ${esc(lg.m)}</h2>
    <div class="tiles slim"><div class="tile main"><div class="v won">${num(lg.sum)}<small>원</small></div><div class="k">이번 달 지출</div></div>
    <div class="tile"><div class="v">${num(lg.n)}건</div><div class="k">결제</div></div></div>${vs}${chart}${cats}</section>`;
}

function secBackup(bk) {
  if (!bk) return '<section><h2>백업</h2><p class="empty">백업 기록이 없어요</p></section>';
  return `<section><h2>아이클라우드 백업</h2>
    <div class="row"><span class="pill ${bk.ok ? "ok" : "bad"}">${bk.ok ? "✅ 정상" : "⚠️ 확인 필요"}</span>
    <span class="at"> · 마지막 ${esc(bk.a)} · 파일 ${num(bk.f)}개 · ${bk.mb}MB</span></div></section>`;
}

function secUsage(us) {
  if (!us) return '<section><h2>아스라다 사용량</h2><p class="empty">불러오지 못했어요</p></section>';
  const week = us.d.slice(-7).reduce((a, x) => [a[0] + x[1], a[1] + x[2]], [0, 0]);
  const max = Math.max(1, ...us.d.map((x) => x[1]));
  const bars = us.d.map((x, i) => `<div class="bar${x[1] ? "" : " zero"}" data-i="${i}" role="img"
      aria-label="${x[0]} 요청 ${x[1]}건"><i style="height:${(x[1] / max) * 100}%"></i></div>`).join("");
  const pct = Math.min(100, Math.round((us.ctx / us.lim) * 100));
  const rows = us.d.slice().reverse().map((x) => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>$${x[2].toFixed(2)}</td><td>${num(x[3])}</td></tr>`).join("");
  // 구독 한도 게이지: lim = [사용 %, 초기화 시각], reqs = 그 기간 텔레그램 요청 수
  const limit = (name, lim, reqs) => lim
    ? `<div style="margin-bottom:12px"><div class="meta" style="margin:0"><span style="color:var(--ink)">${name}</span><span>${lim[0]}% 사용</span></div>
        <div class="gauge${lim[0] >= 80 ? " warn" : ""}"><i style="width:${Math.min(100, lim[0])}%"></i></div>
        <div class="meta"><span>텔레그램 요청 ${reqs}건</span><span>${esc(lim[1])} 초기화</span></div></div>`
    : `<div class="meta" style="margin:0 0 12px"><span style="color:var(--ink)">${name}</span><span>텔레그램 요청 ${reqs}건</span></div>`;
  return `<section><h2>아스라다 사용량</h2>
    ${limit("5시간 한도", us.lim5, us.h5[0])}
    ${limit("주간 한도", us.lim7, week[0])}
    ${us.limAt ? `<div class="meta" style="margin:-6px 0 12px"><span>한도는 터미널 사용까지 합친 계정 전체 기준 · ${esc(us.limAt)} 확인</span></div>` : ""}
    <div class="chart" id="chart"><div class="tip" id="tip"></div><div class="bars">${bars}</div>
      <div class="xlab"><span>${us.d[0][0]}</span><span>일별 요청 수 (최근 ${us.d.length}일)</span><span>오늘</span></div></div>
    <div style="margin-top:14px"><div class="meta" style="margin:0"><span style="color:var(--ink)">지금 대화 크기</span><span>${num(us.ctx)} / ${num(us.lim)} 토큰 · ${pct}%</span></div>
      <div class="gauge${pct >= 80 ? " warn" : ""}"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>100%가 되면 다음 메시지부터 새 대화</span></div></div>
    <details><summary>표로 보기 · API 환산 금액 (구독이라 실제 청구 아님)</summary>
      <table><tr><th>날짜</th><th>요청</th><th>API 환산</th><th>출력 토큰</th></tr>${rows}</table>
      <p class="at">최근 7일 API 환산 $${week[1].toFixed(2)}</p></details>
  </section>`;
}

// 막대를 누르거나 올리면 말풍선. label(i) 가 말풍선 글자
function bindChart(chartSel, tipSel, label) {
  const chart = $(chartSel), tip = $(tipSel);
  if (!chart) return;
  const show = (el) => {
    chart.querySelectorAll(".bar.sel").forEach((b) => b.classList.remove("sel"));
    el.classList.add("sel");
    tip.textContent = label(+el.dataset.i);
    const r = el.getBoundingClientRect(), c = chart.getBoundingClientRect();
    const left = Math.min(Math.max(r.left - c.left + r.width / 2, 70), c.width - 70);
    tip.style.left = left + "px";
    tip.style.display = "block";
  };
  chart.querySelectorAll(".bar").forEach((b) => {
    b.addEventListener("pointerenter", () => show(b));
    b.addEventListener("click", () => show(b));
  });
  chart.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}

// 가계부 분류 칸을 꾹 누르면(0.45초) 그 분류의 이번 달 내역을 아래에서 올라오는 팝업으로
function bindRings(lg) {
  if (!lg.it) return;
  const shown = lg.cat.filter((c) => c[1] > 0).map((c) => c[0]);
  const open = (cat) => {
    const etc = cat === "그 외";
    const rows = lg.it.filter((x) => (etc ? !shown.includes(x[3]) : x[3] === cat));
    const total = etc ? Object.entries(lg.ic || {}).filter(([k]) => !shown.includes(k)).reduce((a, [, n]) => a + n, 0)
                      : (lg.ic || {})[cat] || rows.length;
    const list = rows.map((x) => `<div class="li"><span class="at">${esc(lg.m)} ${x[0]}일</span>
      <span>${esc(x[1])}${etc || x[4] ? ` <span class="at">· ${esc(x[4] || x[3])}</span>` : ""}</span><b>${num(x[2])}원</b></div>`).join("");
    const more = total > rows.length ? `<div class="more">큰 금액 ${rows.length}건만 보여요 (전체 ${total}건)</div>` : "";
    const bg = document.createElement("div");
    bg.className = "pop-bg";
    bg.innerHTML = `<div class="pop"><h3><span>${esc(cat)}</span><span class="at">${total}건</span></h3>${list || '<p class="empty">내역이 없어요</p>'}${more}</div>`;
    bg.addEventListener("click", (e) => { if (e.target === bg) bg.remove(); });
    document.body.appendChild(bg);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
  };
  document.querySelectorAll(".ring-it[data-cat]").forEach((el) => {
    let timer = null, x0 = 0, y0 = 0;
    const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove("hold"); };
    el.addEventListener("pointerdown", (e) => {
      x0 = e.clientX; y0 = e.clientY;
      el.classList.add("hold");
      timer = setTimeout(() => { cancel(); open(el.dataset.cat); }, 450);
    });
    el.addEventListener("pointermove", (e) => { if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
    ["pointerup", "pointerleave", "pointercancel"].forEach((t) => el.addEventListener(t, cancel));
    el.addEventListener("contextmenu", (e) => e.preventDefault());
  });
}

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso + ":00+09:00").getTime()) / 60000);
  if (min < 1) return "방금";
  if (min < 60) return `${min}분 전`;
  if (min < 60 * 24) return `${Math.round(min / 60)}시간 전`;
  return `${Math.round(min / 1440)}일 전`;
}

// 바로가기 버튼: [칸 id, 버튼 이름]. 칸은 mark() 로 id 를 단다
const JUMPS = [["today", "오늘"], ["ev", "일정"], ["st", "코디"], ["hl", "건강"], ["yt", "유튜브"], ["lg", "가계부"], ["us", "사용량"]];
const mark = (id, html) => html.replace("<section", `<section id="s-${id}" data-c="${id}"`);

function bindJump() {
  const nav = $("#jump");
  const items = JUMPS.filter(([id]) => document.getElementById(`s-${id}`));
  nav.innerHTML = items.map(([id, name]) => `<button type="button" data-id="${id}" data-j="${id}">${name}</button>`).join("");
  nav.hidden = false;
  const btns = [...nav.querySelectorAll("button")];
  const setOn = (id) => btns.forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  btns.forEach((b) => b.addEventListener("click", () => {
    document.getElementById(`s-${b.dataset.id}`).scrollIntoView({ behavior: "smooth", block: "start" });
    setOn(b.dataset.id);
  }));
  // 스크롤하면 지금 보고 있는 칸의 버튼에 불이 들어온다
  const onScroll = () => {
    let cur = items[0][0];
    for (const [id] of items) {
      if (document.getElementById(`s-${id}`).getBoundingClientRect().top <= 140) cur = id;
    }
    setOn(cur);
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}

async function main() {
  // 숫자는 '?d=' 에 담겨 온다. 아이폰 텔레그램이 '#' 뒤를 덮어쓰기 때문 (예전 '#' 방식도 읽어줌)
  const hash = new URLSearchParams(location.search).get("d")
    || location.hash.slice(1).split("&").find((p) => p && !p.includes("=")) || "";
  if (!hash) {
    $("#app").innerHTML = '<section><p class="empty">텔레그램에서 아스라다에게 /home 을 보내 열어주세요.</p></section>';
    return;
  }
  let d;
  try { d = await decode(hash); }
  catch (e) {
    $("#app").innerHTML = '<section><p class="empty">숫자를 읽지 못했어요. /home 으로 다시 열어주세요.</p></section>';
    return;
  }
  const a = ago(d.t);
  const old = (Date.now() - new Date(d.t + ":00+09:00").getTime()) > 30 * 60000;
  $("#when").innerHTML = `<span class="${old ? "stale" : ""}">${esc(d.tl)} 기준 · ${a}</span>`;
  window.__bot = d.bot;
  const canEdit = !!(tg && tg.openTelegramLink && d.bot);
  $("#app").innerHTML = mark("today", secToday(d)) + mark("wx", secWeather(d.wx)) + mark("ev", secEvents(d.ev))
    + mark("st", secStyle(d.st, d.wx)) + mark("hl", secHealth(d.hl)) + mark("yt", secYoutube(d.yt, canEdit))
    + mark("lg", secLedger(d.lg)) + mark("bk", secBackup(d.bk)) + mark("us", secUsage(d.us));
  bindJump();
  if (d.us) bindChart("#chart", "#tip", (i) => { const x = d.us.d[i]; return `${x[0]} · 요청 ${x[1]}건 · $${x[2].toFixed(2)}`; });
  if (d.lg) bindRings(d.lg);
  if (d.lg && d.lg.dd) bindChart("#lgchart", "#lgtip", (i) => `${d.lg.m} ${i + 1}일 · ${num(d.lg.dd[i])}원`);
  if (d.hl && d.hl.w) bindChart("#hlchart", "#hltip", (i) => `${d.hl.w[i][0]} · ${num(d.hl.w[i][1])}보`);
  bindStages();
  bindLinks();
  $("#foot").textContent = "최신 숫자는 /home 을 다시 보내면 돼요";
}
main();
</script>
