<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>아스라다 홈</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--
  아스라다 홈 — 텔레그램 미니앱. 서버 없이 동작한다.
  봇(dashboard.py)이 버튼을 보낼 때 숫자를 JSON→zlib→base64url 로 URL '#' 뒤에 담는다.
  '#' 뒤는 브라우저 밖으로 나가지 않으므로 이 페이지를 올린 곳엔 숫자가 남지 않는다.
-->
<style>
  /*
    디자인: BMW M (DESIGN-bmw-m.md, 2026-09-30 적용)
    검은 바탕 + 흰 글씨, 모서리 0, 제목은 굵게(700)·본문은 가늘게(300),
    대문자 라벨은 1.5px 자간, M 삼색 줄은 머리 장식으로만 쓴다(버튼·배경색으로 쓰지 않음).
    텔레그램 테마와 상관없이 항상 어두운 화면.
  */
  :root {
    --bg: #000000;          /* canvas */
    --card: #1a1a1a;        /* surface-card */
    --soft: #0d0d0d;        /* surface-soft (숫자 칸) */
    --ink: #ffffff;         /* on-dark */
    --body: #bbbbbb;        /* 본문 */
    --muted: #7e7e7e;       /* 보조 글씨 */
    --accent: #1c69d4;      /* bmw-blue: 막대·게이지 */
    --line: #3c3c3c;        /* hairline */
    --track: #262626;       /* hairline-strong: 빈 막대 */
    --m1: #0066b1; --m2: #1c69d4; --m3: #e22718;  /* M 삼색 */
    /* 상태색: 아이콘+글자와 함께만 쓴다 */
    --red: #e22718; --yellow: #f4b400; --green: #0fa336;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--body);
    font: 300 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { padding: 0 12px; }
  header { padding: 20px 16px 16px; }
  header h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.15; color: var(--ink);
              text-transform: uppercase; letter-spacing: -0.5px; }
  header .when { display: block; color: var(--muted); font-size: 12px; letter-spacing: .5px; margin-top: 6px; }
  /* M 삼색 줄 — 이 화면의 유일한 장식 */
  .m-stripe { height: 4px; margin: 0 16px 16px;
              background: linear-gradient(90deg, var(--m1) 0 33.33%, var(--m2) 33.33% 66.66%, var(--m3) 66.66% 100%); }
  .stale { color: var(--yellow); }
  section { background: var(--card); border-radius: 0; padding: 20px 16px; margin-bottom: 8px; }
  section h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; color: var(--ink);
               text-transform: uppercase; letter-spacing: 1.5px; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  /* 한 줄 요약 */
  .today { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.3; }
  .today small { display: block; font-weight: 300; color: var(--body); font-size: 14px; margin-top: 4px; }

  /* 유튜브 */
  .yt { padding: 14px 0; border-top: 1px solid var(--line); }
  .yt:first-of-type { border-top: 0; padding-top: 0; }
  .yt .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .yt .title { font-weight: 700; color: var(--ink); }
  .yt .dday { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); white-space: nowrap; letter-spacing: 1px; }
  .yt .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; }
  .badge.r { color: var(--red); } .badge.y { color: var(--yellow); } .badge.g { color: var(--green); }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 10px; }
  .steps div { height: 4px; background: var(--track); }
  .steps div.on { background: var(--accent); }
  .steps-label { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 10px; color: var(--muted); margin-top: 5px; text-align: center; letter-spacing: .5px; }
  .steps-label .cur { color: var(--ink); font-weight: 700; }
  /* 단계 버튼 — 누르면 봇에게 단계 변경을 보낸다 */
  .steps-label button { font: inherit; color: inherit; background: none; border: 0; padding: 6px 0; margin-top: -6px;
                        cursor: pointer; letter-spacing: inherit; -webkit-tap-highlight-color: transparent; }
  .steps-label button.cur { color: var(--ink); font-weight: 700; }
  .steps-label button:active { color: var(--accent); }
  .yt .done { margin-top: 10px; width: 100%; padding: 10px; background: none; border: 1px solid var(--line);
              color: var(--ink); font: 700 12px/1 inherit; letter-spacing: 1.5px; cursor: pointer; }
  .yt .done:active { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }

  /* 날씨 */
  .wx { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .wx .big { font-size: 44px; font-weight: 700; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .wx .big small { font-size: 18px; color: var(--muted); font-weight: 300; letter-spacing: 0; }
  .wx .cond { text-align: right; color: var(--ink); font-size: 15px; }
  .wx .cond small { display: block; color: var(--muted); font-size: 13px; }
  .wx-tip { margin-top: 14px; padding: 10px 12px; background: var(--soft); border-left: 2px solid var(--accent);
            color: var(--ink); font-size: 14px; }
  .hours { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 12px; text-align: center; }
  .hours div { background: var(--soft); padding: 8px 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hours b { display: block; color: var(--ink); font-size: 15px; font-weight: 700; margin: 2px 0; }
  .hours div.now { outline: 1px solid var(--accent); outline-offset: -1px; }

  /* 오늘 일정 타임라인 */
  .allday { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .allday span { background: var(--soft); border-left: 2px solid var(--accent); padding: 6px 10px; font-size: 13px; color: var(--ink); }
  .allday em { font-style: normal; color: var(--muted); font-size: 11px; margin-left: 6px; letter-spacing: .5px; }
  .tl { position: relative; margin-left: 58px; border-left: 1px solid var(--line); }
  .tl .ev { position: relative; padding: 0 0 16px 16px; font-size: 14px; }
  .tl .ev:last-child { padding-bottom: 2px; }
  .tl .ev::before { content: ""; position: absolute; left: -4px; top: 7px; width: 7px; height: 7px; background: var(--accent); }
  .tl .ev .t { position: absolute; left: -58px; width: 48px; top: 0; text-align: right; color: var(--ink);
               font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }
  .tl .ev .ttl { color: var(--ink); }
  .tl .ev .sub { color: var(--muted); font-size: 12px; }
  .tl .ev.past { opacity: .45; }
  .tl .ev.past::before { background: var(--track); }
  .tl .nowline { position: relative; height: 0; border-top: 2px solid var(--accent); margin: 0 0 16px -1px; }
  .tl .nowline span { position: absolute; left: -58px; top: -9px; width: 48px; text-align: right; font-size: 11px;
                      font-weight: 700; color: var(--accent); letter-spacing: 1px; }

  /* 리스트 */
  .li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .li:first-of-type { border-top: 0; padding-top: 0; }
  .li .at { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 92px; }

  /* 숫자 칸 (spec-cell) */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
  .tile { background: var(--soft); padding: 16px; }
  .tile .v { font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; }

  /* 막대그래프 (단일 계열) */
  .chart { position: relative; margin-top: 18px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 1px solid var(--line); }
  .bar { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
  .bar i { display: block; width: 100%; background: var(--accent); min-height: 0; opacity: .85; }
  .bar.sel i, .bar:hover i { opacity: 1; background: var(--ink); }
  .bar.zero i { height: 2px !important; background: var(--track); }
  .xlab { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 6px; letter-spacing: .5px; }
  .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg);
         font-size: 12px; font-weight: 700; padding: 5px 9px; white-space: nowrap; pointer-events: none; display: none; }

  /* 게이지 */
  .gauge { height: 4px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .gauge i { display: block; height: 100%; background: var(--accent); }
  .gauge.warn i { background: var(--yellow); }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 5px; }

  details { margin-top: 16px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  td, th { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); font-weight: 300; }
  td:first-child, th:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: 1px; }

  .vs { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .vs b { color: var(--ink); font-weight: 700; }
  .cat { margin-top: 12px; }
  .cat .row { display: flex; justify-content: space-between; font-size: 14px; }
  .cat .gauge i { background: var(--accent); }
  .ok { color: var(--green); font-weight: 700; } .bad { color: var(--red); font-weight: 700; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .5px; margin-top: 16px; }
</style>
</head>
<body>
<header><h1>Asurada 홈</h1><span class="when" id="when"></span></header>
<div class="m-stripe" aria-hidden="true"></div>
<main id="app"><section><p class="empty">불러오는 중…</p></section></main>
<p class="foot" id="foot"></p>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  // 텔레그램 상단바·바깥 배경도 검정으로 맞춘다 (구버전 앱에선 없는 기능이라 조용히 넘어감)
  try { tg.setHeaderColor("#000000"); tg.setBackgroundColor("#000000"); } catch (e) {}
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n) => Number(n || 0).toLocaleString("ko-KR");
const STAGES = ["수령", "스크립트", "촬영", "편집", "업로드"];
const LEVEL = { r: ["🔴", "서둘러야 함"], y: ["🟡", "여유 없음"], g: ["🟢", "여유 있음"] };

async function decode(hash) {
  const b64 = hash.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}

function dday(l) {
  if (l == null) return "";
  if (l === 0) return "D-DAY";
  return l > 0 ? `D-${l}` : `D+${-l}`;
}

function secToday(d) {
  const urgent = (d.yt || []).find((x) => x.c === "r") || (d.yt || [])[0];
  const next = (d.rm || []).find((x) => !x.p);
  let html = '<section><h2>오늘</h2>';
  if (urgent) {
    html += `<div class="today">${esc(urgent.n)} ${dday(urgent.l)}<small>지금 할 일: ${esc(urgent.todo)}</small></div>`;
  } else {
    html += '<div class="today">급한 영상 없음</div>';
  }
  if (next) html += `<div class="meta"><span>다음 알림</span><span>${esc(next.a)}</span></div>`;
  return html + "</section>";
}

// WMO 날씨 코드 → 이모지
function wxIcon(c) {
  if (c === 0) return "☀️";
  if (c <= 2) return "🌤️";
  if (c === 3) return "☁️";
  if (c <= 48) return "🌫️";
  if (c <= 67 || (c >= 80 && c <= 82)) return "🌧️";
  if (c <= 86) return "🌨️";
  return "⛈️";
}

function secWeather(wx) {
  if (!wx) return "";
  const hourNow = new Date().getHours();
  const hours = wx.h.map((h) => {
    const cur = hourNow >= h[0] && hourNow < h[0] + 3;
    return `<div class="${cur ? "now" : ""}">${h[0]}시<b>${h[1]}°</b>${wxIcon(h[3])}${h[2] >= 30 ? ` ${h[2]}%` : ""}</div>`;
  }).join("");
  return `<section><h2>날씨 · ${esc(wx.p)}</h2>
    <div class="wx"><div class="big">${wx.now ?? wx.hi}°<small> 지금</small></div>
      <div class="cond">${wxIcon(wx.c)} ${esc(wx.w)}<small>최저 ${wx.lo}° · 최고 ${wx.hi}° · 비 ${wx.pp}%</small></div></div>
    <div class="hours">${hours}</div>
    <div class="wx-tip">${esc(wx.tip)}</div></section>`;
}

function secEvents(ev) {
  const head = '<section><h2>오늘 일정</h2>';
  if (!ev) return head + '<p class="empty">아침 브리핑 뒤에 채워져요</p></section>';
  const allday = ev.ev.filter((e) => !e[0]);
  const timed = ev.ev.filter((e) => e[0]);
  let html = head;
  if (allday.length) {
    html += `<div class="allday">${allday.map((e) => `<span>${esc(e[2])}${e[3] ? `<em>${esc(e[3])}</em>` : ""}</span>`).join("")}</div>`;
  }
  if (timed.length) {
    const d = new Date();
    const now = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    let placed = false, rows = "";
    const nowline = `<div class="nowline"><span>NOW</span></div>`;
    for (const e of timed) {
      if (!placed && e[0] > now) { rows += nowline; placed = true; }
      const past = (e[1] || e[0]) <= now;
      rows += `<div class="ev${past ? " past" : ""}"><span class="t">${esc(e[0])}</span>
        <div class="ttl">${esc(e[2])}</div>
        <div class="sub">${e[1] ? `~${esc(e[1])}` : ""}${e[3] ? `${e[1] ? " · " : ""}${esc(e[3])}` : ""}</div></div>`;
    }
    if (!placed) rows += nowline;
    html += `<div class="tl">${rows}</div>`;
  } else if (!allday.length) {
    html += '<p class="empty">오늘은 일정이 없어요</p>';
  }
  return html + `<div class="meta"><span>${esc(ev.at)} 캘린더 기준</span></div></section>`;
}

// 유튜브 단계 변경 — 미니앱은 봇에 직접 말을 못 걸어서 t.me 링크로 '/start yt_번호_단계' 를 보내게 한다
function moveStage(id, title, idx) {
  const bot = window.__bot;
  const label = idx === 5 ? "완료" : STAGES[idx];
  const go = () => {
    tg.openTelegramLink(`https://t.me/${bot}?start=yt_${id}_${idx}`);
    try { tg.close(); } catch (e) {}
  };
  const q = idx === 5 ? `'${title}' 업로드 끝났나요? 완료로 옮길게요.` : `'${title}'을(를) ${label} 단계로 옮길까요?`;
  if (tg.showConfirm) tg.showConfirm(q, (ok) => ok && go());
  else if (confirm(q)) go();
}

function secYoutube(yt, canEdit) {
  if (yt == null) return '<section><h2>유튜브 · small table</h2><p class="empty">불러오지 못했어요</p></section>';
  if (!yt.length) return '<section><h2>유튜브 · small table</h2><p class="empty">진행 중인 영상이 없어요</p></section>';
  const rows = yt.map((x) => {
    const [ico, lab] = LEVEL[x.c] || LEVEL.g;
    const steps = STAGES.map((_, i) => `<div class="${i <= x.si ? "on" : ""}"></div>`).join("");
    const labels = STAGES.map((s, i) => canEdit && x.id != null
      ? `<button type="button" class="${i === x.si ? "cur" : ""}" data-id="${x.id}" data-i="${i}">${s}</button>`
      : `<span class="${i === x.si ? "cur" : ""}">${s}</span>`).join("");
    const done = canEdit && x.id != null && x.si === 4
      ? `<button type="button" class="done" data-id="${x.id}" data-i="5">업로드 끝 → 완료</button>` : "";
    return `<div class="yt" data-title="${esc(x.n)}">
      <div class="row"><span class="title">${esc(x.n)}${x.sp ? " 💰" : ""}</span><span class="dday">${dday(x.l)}</span></div>
      <div class="sub"><span class="badge ${x.c}">${ico} ${lab}</span> · 업로드 ${esc(x.d || "미정")} · 지금 ${esc(x.s)}</div>
      <div class="steps" aria-hidden="true">${steps}</div>
      <div class="steps-label">${labels}</div>${done}
    </div>`;
  }).join("");
  const hint = canEdit ? '<p class="hint">단계 이름을 누르면 바로 옮겨져요</p>' : "";
  return `<section><h2>유튜브 · small table</h2>${hint}${rows}</section>`;
}

function bindStages() {
  document.querySelectorAll(".yt button[data-id]").forEach((b) => {
    b.addEventListener("click", () => {
      const i = +b.dataset.i, card = b.closest(".yt");
      const cur = card.querySelector(".steps-label .cur");
      if (cur === b) return;   // 이미 그 단계
      moveStage(+b.dataset.id, card.dataset.title, i);
    });
  });
}

function secReminders(rm) {
  let body;
  if (rm == null) body = '<p class="empty">불러오지 못했어요</p>';
  else if (!rm.length) body = '<p class="empty">걸어둔 알림이 없어요</p>';
  else body = rm.map((x) => `<div class="li"><span class="at">${esc(x.a)}</span><span>${esc(x.m)}${x.r ? ` <span class="at">(${esc(x.r)})</span>` : ""}</span></div>`).join("");
  return `<section><h2>리마인드</h2>${body}</section>`;
}

function secLedger(lg) {
  if (!lg) return '<section><h2>가계부</h2><p class="empty">아직 기록된 지출이 없어요</p></section>';
  const max = Math.max(1, ...lg.cat.map((c) => c[1]));
  const cats = lg.cat.map((c) => `<div class="cat"><div class="row"><span>${esc(c[0])}</span><span>${num(c[1])}원</span></div>
      <div class="gauge"><i style="width:${Math.max(2, (c[1] / max) * 100)}%"></i></div></div>`).join("");
  const dd = lg.dd || [];
  let chart = "";
  if (dd.length) {
    const dmax = Math.max(1, ...dd);
    const bars = dd.map((v, i) => `<div class="bar${v > 0 ? "" : " zero"}" data-i="${i}" role="img"
        aria-label="${i + 1}일 ${num(v)}원"><i style="height:${(Math.max(0, v) / dmax) * 100}%"></i></div>`).join("");
    chart = `<div class="chart" id="lgchart"><div class="tip" id="lgtip"></div><div class="bars">${bars}</div>
      <div class="xlab"><span>1일</span><span>날짜별 지출</span><span>오늘</span></div></div>`;
  }
  let vs = "";
  if (lg.prev) {
    const diff = Math.round(((lg.sum - lg.prev) / lg.prev) * 100);
    const word = diff === 0 ? "똑같아요" : diff > 0 ? `<b>${diff}% 더</b> 썼어요` : `<b>${-diff}% 덜</b> 썼어요`;
    vs = `<div class="vs">${esc(lg.pm)} 같은 기간(${num(lg.prev)}원)보다 ${word}</div>`;
  }
  return `<section><h2>가계부 · ${esc(lg.m)}</h2>
    <div class="tiles"><div class="tile"><div class="v">${num(lg.sum)}원</div><div class="k">이번 달 지출</div></div>
    <div class="tile"><div class="v">${num(lg.n)}건</div><div class="k">결제</div></div></div>${vs}${chart}${cats}</section>`;
}

function secBackup(bk) {
  if (!bk) return '<section><h2>백업</h2><p class="empty">백업 기록이 없어요</p></section>';
  return `<section><h2>아이클라우드 백업</h2>
    <div class="row"><span class="${bk.ok ? "ok" : "bad"}">${bk.ok ? "✅ 정상" : "⚠️ 확인 필요"}</span>
    <span class="at"> · 마지막 ${esc(bk.a)} · 파일 ${num(bk.f)}개 · ${bk.mb}MB</span></div></section>`;
}

function secUsage(us) {
  if (!us) return '<section><h2>아스라다 사용량</h2><p class="empty">불러오지 못했어요</p></section>';
  const week = us.d.slice(-7).reduce((a, x) => [a[0] + x[1], a[1] + x[2]], [0, 0]);
  const max = Math.max(1, ...us.d.map((x) => x[1]));
  const bars = us.d.map((x, i) => `<div class="bar${x[1] ? "" : " zero"}" data-i="${i}" role="img"
      aria-label="${x[0]} 요청 ${x[1]}건"><i style="height:${(x[1] / max) * 100}%"></i></div>`).join("");
  const pct = Math.min(100, Math.round((us.ctx / us.lim) * 100));
  const rows = us.d.slice().reverse().map((x) => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>$${x[2].toFixed(2)}</td><td>${num(x[3])}</td></tr>`).join("");
  // 구독 한도 게이지: lim = [사용 %, 초기화 시각], reqs = 그 기간 텔레그램 요청 수
  const limit = (name, lim, reqs) => lim
    ? `<div style="margin-bottom:12px"><div class="meta" style="margin:0"><span style="color:var(--ink)">${name}</span><span>${lim[0]}% 사용</span></div>
        <div class="gauge${lim[0] >= 80 ? " warn" : ""}"><i style="width:${Math.min(100, lim[0])}%"></i></div>
        <div class="meta"><span>텔레그램 요청 ${reqs}건</span><span>${esc(lim[1])} 초기화</span></div></div>`
    : `<div class="meta" style="margin:0 0 12px"><span style="color:var(--ink)">${name}</span><span>텔레그램 요청 ${reqs}건</span></div>`;
  return `<section><h2>아스라다 사용량</h2>
    ${limit("5시간 한도", us.lim5, us.h5[0])}
    ${limit("주간 한도", us.lim7, week[0])}
    ${us.limAt ? `<div class="meta" style="margin:-6px 0 12px"><span>한도는 터미널 사용까지 합친 계정 전체 기준 · ${esc(us.limAt)} 확인</span></div>` : ""}
    <div class="chart" id="chart"><div class="tip" id="tip"></div><div class="bars">${bars}</div>
      <div class="xlab"><span>${us.d[0][0]}</span><span>일별 요청 수 (최근 ${us.d.length}일)</span><span>오늘</span></div></div>
    <div style="margin-top:14px"><div class="meta" style="margin:0"><span style="color:var(--ink)">지금 대화 크기</span><span>${num(us.ctx)} / ${num(us.lim)} 토큰 · ${pct}%</span></div>
      <div class="gauge${pct >= 80 ? " warn" : ""}"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>100%가 되면 다음 메시지부터 새 대화</span></div></div>
    <details><summary>표로 보기 · API 환산 금액 (구독이라 실제 청구 아님)</summary>
      <table><tr><th>날짜</th><th>요청</th><th>API 환산</th><th>출력 토큰</th></tr>${rows}</table>
      <p class="at">최근 7일 API 환산 $${week[1].toFixed(2)}</p></details>
  </section>`;
}

// 막대를 누르거나 올리면 말풍선. label(i) 가 말풍선 글자
function bindChart(chartSel, tipSel, label) {
  const chart = $(chartSel), tip = $(tipSel);
  if (!chart) return;
  const show = (el) => {
    chart.querySelectorAll(".bar.sel").forEach((b) => b.classList.remove("sel"));
    el.classList.add("sel");
    tip.textContent = label(+el.dataset.i);
    const r = el.getBoundingClientRect(), c = chart.getBoundingClientRect();
    const left = Math.min(Math.max(r.left - c.left + r.width / 2, 70), c.width - 70);
    tip.style.left = left + "px";
    tip.style.display = "block";
  };
  chart.querySelectorAll(".bar").forEach((b) => {
    b.addEventListener("pointerenter", () => show(b));
    b.addEventListener("click", () => show(b));
  });
  chart.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso + ":00+09:00").getTime()) / 60000);
  if (min < 1) return "방금";
  if (min < 60) return `${min}분 전`;
  if (min < 60 * 24) return `${Math.round(min / 60)}시간 전`;
  return `${Math.round(min / 1440)}일 전`;
}

async function main() {
  // 숫자는 '?d=' 에 담겨 온다. 아이폰 텔레그램이 '#' 뒤를 덮어쓰기 때문 (예전 '#' 방식도 읽어줌)
  const hash = new URLSearchParams(location.search).get("d")
    || location.hash.slice(1).split("&").find((p) => p && !p.includes("=")) || "";
  if (!hash) {
    $("#app").innerHTML = '<section><p class="empty">텔레그램에서 아스라다에게 /home 을 보내 열어주세요.</p></section>';
    return;
  }
  let d;
  try { d = await decode(hash); }
  catch (e) {
    $("#app").innerHTML = '<section><p class="empty">숫자를 읽지 못했어요. /home 으로 다시 열어주세요.</p></section>';
    return;
  }
  const a = ago(d.t);
  const old = (Date.now() - new Date(d.t + ":00+09:00").getTime()) > 30 * 60000;
  $("#when").innerHTML = `<span class="${old ? "stale" : ""}">${esc(d.tl)} 기준 · ${a}</span>`;
  window.__bot = d.bot;
  const canEdit = !!(tg && tg.openTelegramLink && d.bot);
  $("#app").innerHTML = secToday(d) + secWeather(d.wx) + secEvents(d.ev) + secYoutube(d.yt, canEdit)
    + secReminders(d.rm) + secLedger(d.lg) + secBackup(d.bk) + secUsage(d.us);
  if (d.us) bindChart("#chart", "#tip", (i) => { const x = d.us.d[i]; return `${x[0]} · 요청 ${x[1]}건 · $${x[2].toFixed(2)}`; });
  if (d.lg && d.lg.dd) bindChart("#lgchart", "#lgtip", (i) => `${d.lg.m} ${i + 1}일 · ${num(d.lg.dd[i])}원`);
  bindStages();
  $("#foot").textContent = "최신 숫자는 /home 을 다시 보내면 돼요";
}
main();
</script>
